name: Actualizar festivos CAIB
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_caib.py'
      - 'vacaciones/tests/test_caib.py'
      - '.github/workflows/caib-festivos.yml'
permissions:
  contents: write
concurrency:
  group: caib-festivos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector PDF
        run: python -m pip install pypdf
      - name: Comprobar extracción y validación
        run: python -m unittest discover -s vacaciones/tests -p 'test_caib.py' -v
      - name: Descargar exclusivamente desde CAIB
        run: python scripts/update_caib.py
      - name: Guardar copias oficiales verificadas
        run: |
          git add vacaciones/data/caib-palma-*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar copias oficiales CAIB para Palma"
          git push
