name: Comprobar AU Ido
on:
  push:
    branches: [main]
    paths: ['**.js', '**.mjs', '**.html', 'package.json', '.github/workflows/checks.yml']
  pull_request:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de cuentas, acceso, calendario y copias
        run: npm test
      - name: Preparar portal y aplicaciones
        run: npm run build
